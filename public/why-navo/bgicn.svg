<svg width="72" height="83" viewBox="0 0 72 83" fill="none" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<filter id="noiseFilter" x="-20" y="-20" width="112" height="123" primitiveUnits="userSpaceOnUse">
			<feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="4" stitchTiles="stitch" result="noise" />
			<feColorMatrix in="noise" type="saturate" values="0" result="gray" />
			<feComponentTransfer in="gray" result="grain">
				<feFuncA type="table" tableValues="0 0.6" />
			</feComponentTransfer>
			<feMerge>
				<feMergeNode in="grain" />
			</feMerge>
		</filter>

		<!-- clip path matching the rounded rectangle shape -->
		<clipPath id="shapeClip">
			<rect x="-9.24554" y="17.7666" width="47.0939" height="90" rx="23.547" transform="rotate(-35 -9.24554 17.7666)"/>
		</clipPath>
	</defs>

	<!-- main rounded rectangle (orange shape, kept fully intact) -->
	<rect x="-9.24554" y="17.7666" width="47.0939" height="90" rx="23.547" transform="rotate(-35 -9.24554 17.7666)" fill="#F5B66F" fill-opacity="0.5"/>

	<!-- noise grain, clipped to the same shape so it never bleeds outside it -->
	<g clip-path="url(#shapeClip)">
		<rect x="-9.24554" y="17.7666" width="47.0939" height="90" rx="23.547" transform="rotate(-35 -9.24554 17.7666)"
		      fill="#000" filter="url(#noiseFilter)" style="mix-blend-mode:soft-light;" opacity="0.7" />
	</g>
</svg>